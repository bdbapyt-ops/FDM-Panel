services:
  - type: web
    name: fdm-user-panel
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FIREBASE_PROJECT_ID
        value: fdm-database
      - key: FIRESTORE_USERS_COLLECTION
        value: users
      - key: COOKIE_SECURE
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
